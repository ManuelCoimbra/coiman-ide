[package]
name = "rust-code-core"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.23"
ed25519-dalek = "3"
encoding_rs = "0.8.42"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
quick-xml = "0.41"
oxc_allocator = "0.156"
oxc_codegen = "0.156"
oxc_parser = "0.156"
oxc_semantic = "0.156"
oxc_span = "0.156"
oxc_transformer = "0.156"
lsp-types = "0.95.1"
notify = "8.2.0"
nucleo = "0.5.0"
portable-pty = "0.9.0"
regex = "1.13.1"
ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.11"
similar = "2"
streaming-iterator = "0.1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
toml = "1.1.8"
unicode-width = "0.2"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7.2"
url = "2"
wasmtime = { version = "50", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }



[[bench]]
name = "editor"
harness = false
