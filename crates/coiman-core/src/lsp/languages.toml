# Languages that need no code in the editor. Servers are found on PATH and never
# installed from here; `hint` says how to get each one.

[[language]]
name = "HTML"
extensions = ["html", "htm", "xhtml"]
server = "vscode-html-language-server --stdio"
root_markers = ["package.json"]
hint = "npm install -g vscode-langservers-extracted"
runs_project_code = false

[[language]]
name = "CSS"
extensions = ["css"]
comment = "/*"
server = "vscode-css-language-server --stdio"
root_markers = ["package.json"]
hint = "npm install -g vscode-langservers-extracted"
runs_project_code = false

[[language]]
name = "SCSS"
extensions = ["scss"]
comment = "//"
server = "vscode-css-language-server --stdio"
root_markers = ["package.json"]
hint = "npm install -g vscode-langservers-extracted"
runs_project_code = false

[[language]]
name = "Less"
extensions = ["less"]
comment = "//"
server = "vscode-css-language-server --stdio"
root_markers = ["package.json"]
hint = "npm install -g vscode-langservers-extracted"
runs_project_code = false

[[language]]
name = "JSON"
extensions = ["json"]
server = "vscode-json-language-server --stdio"
root_markers = ["package.json"]
hint = "npm install -g vscode-langservers-extracted"
runs_project_code = false

[[language]]
name = "JSON with Comments"
language_id = "jsonc"
extensions = ["jsonc"]
comment = "//"
server = "vscode-json-language-server --stdio"
root_markers = ["package.json"]
hint = "npm install -g vscode-langservers-extracted"
runs_project_code = false

[[language]]
name = "Clojure"
extensions = ["clj", "cljs", "cljc", "edn", "bb"]
comment = ";;"
server = "clojure-lsp"
root_markers = ["deps.edn", "project.clj", "bb.edn", "shadow-cljs.edn"]
hint = "Install clojure-lsp from clojure-lsp.io"

[[language]]
name = "Ruby"
repl = "irb"
extensions = ["rb", "rake", "gemspec"]
comment = "#"
server = "ruby-lsp"
root_markers = ["Gemfile"]
run = "ruby {file}"
hint = "gem install ruby-lsp"

[[language]]
name = "PHP"
extensions = ["php"]
comment = "//"
server = "intelephense --stdio"
root_markers = ["composer.json"]
run = "php {file}"
hint = "npm install -g intelephense"
runs_project_code = false

[[language]]
name = "Lua"
repl = "lua -i"
extensions = ["lua"]
comment = "--"
server = "lua-language-server"
root_markers = [".luarc.json", "init.lua"]
run = "lua {file}"
hint = "Get lua-language-server from github.com/LuaLS/lua-language-server"
runs_project_code = false

[[language]]
name = "Shell"
language_id = "shellscript"
extensions = ["sh", "bash", "zsh"]
comment = "#"
server = "bash-language-server start"
hint = "npm install -g bash-language-server"
runs_project_code = false

[[language]]
name = "Zig"
extensions = ["zig"]
comment = "//"
server = "zls"
root_markers = ["build.zig"]
run = "zig run {file}"
hint = "Get zls from github.com/zigtools/zls, matching your Zig version"

[[language]]
name = "Gleam"
extensions = ["gleam"]
comment = "//"
server = "gleam lsp"
root_markers = ["gleam.toml"]
run = "gleam run"
hint = "Comes with Gleam, from gleam.run"

[[language]]
name = "Elixir"
repl = "iex"
extensions = ["ex", "exs"]
comment = "#"
server = "elixir-ls"
root_markers = ["mix.exs"]
run = "elixir {file}"
hint = "Get ElixirLS from github.com/elixir-lsp/elixir-ls, and put elixir-ls on PATH"

[[language]]
name = "Haskell"
repl = "ghci"
extensions = ["hs"]
comment = "--"
server = "haskell-language-server-wrapper --lsp"
root_markers = ["stack.yaml", "cabal.project", "hie.yaml"]
run = "runghc {file}"
hint = "Install it with GHCup: ghcup install hls"

[[language]]
name = "OCaml"
repl = "ocaml"
extensions = ["ml", "mli"]
comment = "(*"
server = "ocamllsp"
root_markers = ["dune-project"]
run = "ocaml {file}"
hint = "opam install ocaml-lsp-server"

[[language]]
name = "Nix"
extensions = ["nix"]
comment = "#"
server = "nil"
root_markers = ["flake.nix"]
hint = "nix profile install nixpkgs#nil"

[[language]]
name = "Fortran"
extensions = ["f90", "f95", "f03", "f08"]
comment = "!"
server = "fortls"
hint = "pip install fortls"
runs_project_code = false
include_pattern = '''^\s*include\s+['"]([^'"]+)['"]'''
include_paths = ["include", "inc"]
include_extensions = ["inc", "fi", "h"]

[[language]]
name = "Fortran (Fixed Form)"
language_id = "FortranFixedForm"
extensions = ["f", "for", "fpp", "ftn"]
comment = "C"
server = "fortls"
hint = "pip install fortls"
runs_project_code = false
rulers = [5, 6, 72]
dim_columns = [[73, 0]]
include_pattern = '''^\s*include\s+['"]([^'"]+)['"]'''
include_paths = ["include", "inc"]
include_extensions = ["inc", "fi", "h"]

[[language]]
name = "COBOL"
extensions = ["cbl", "cob", "cpy"]
comment = "*>"
hint = "Editing needs no server: rulers, dim columns and copybooks work without one"
rulers = [6, 7, 11, 72]
dim_columns = [[1, 6], [73, 0]]
include_pattern = '''^.{0,7}\s*COPY\s+["']?([\w-]+)'''
include_paths = ["copybook", "copybooks", "copy", "cpy"]
include_extensions = ["cpy", "cbl", "cob"]

[[language]]
name = "Coq"
extensions = ["v"]
server = "coq-lsp"
root_markers = ["_CoqProject", "dune-project"]
hint = "Install coq-lsp with opam"
comment = "(*"
abbreviations = true
glyphs = "∀∃λ→←↔¬∧∨≤≥≠∈∉⊆∪∩×∘ℕℤℚℝ⟨⟩⊢₁₂"

[[language]]
name = "Lean"
extensions = ["lean"]
comment = "--"
server = "lake serve"
root_markers = ["lakefile.lean", "lakefile.toml", "lean-toolchain"]
hint = "Install Lean with elan, from lean-lang.org"
abbreviations = true
glyphs = "∀∃λ→←↔¬∧∨≤≥≠∈∉⊆∪∩×∘ℕℤℚℝ⟨⟩⊢₁₂"

[[language]]
name = "Agda"
extensions = ["agda"]
comment = "--"
server = "als"
hint = "Install agda-language-server from its GitHub releases"
abbreviations = true
glyphs = "∀∃λ→←↔¬∧∨≡≤≥∈⊤⊥×∘ℕΣΠ⟨⟩₁₂"

[[language]]
name = "APL"
extensions = ["apl", "dyalog", "aplf", "apln"]
comment = "⍝"
hint = "Editing needs no server: the glyph bar works without one"
glyphs = "←→↑↓⍺⍵⍳⍴⍒⍋⌈⌊×÷⌽⍉⊖∊≢≡≠≤≥∧∨⍲⍱⊂⊃⊆∪∩⍎⍕⎕⍞¨⍣⍤∘⍨⌿⍀⋄⍝⍬⌷"

[[language]]
name = "Kotlin"
extensions = ["kt", "kts"]
comment = "//"
server = "kotlin-lsp"
root_markers = ["build.gradle.kts", "build.gradle", "settings.gradle.kts"]
hint = "Get kotlin-lsp from github.com/Kotlin/kotlin-lsp; it's in early development"

[[language]]
name = "YAML"
extensions = ["yaml", "yml"]
comment = "#"
server = "yaml-language-server --stdio"
hint = "npm install -g yaml-language-server"
runs_project_code = false
