[package]
name = "coiman-ide"
version = "0.6.0"
edition = "2024"
description = "Coiman IDE: a code editor and IDE written in Rust"
license = "MIT"
build = "build.rs"

[dependencies]
coiman-core = { path = "../coiman-core" }
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "links", "glow"] }
# Emoji fonts are their own feature since 0.37.
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
serde_json = "1"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
# Session lists in the Agents view group conversations by day.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }
# Fuzzy completion ranking, matching the command palette and file picker.
nucleo = "0.5.0"

# On Android the window is the system's own Activity.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }

# Android has no Trash for apps, and no file dialog but a port's (see hooks::set_file_picker).
[target.'cfg(not(target_os = "android"))'.dependencies]
# Screen readers (eframe has them on Android only with GameActivity).
eframe = { version = "0.37.0", default-features = false, features = ["accesskit"] }
rfd = "0.17.2"
# Pasting an image from the clipboard into the Agents ask box (no Android clipboard).
arboard = "3"
trash = "5.2.9"

# On Linux the window opens through X11 or Wayland, whichever the desktop runs.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }
