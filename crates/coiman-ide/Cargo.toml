[package]
name = "coiman-ide"
version = "0.4.1"
edition = "2024"
description = "Coiman IDE: a code editor and IDE written in Rust"
license = "MIT"
build = "build.rs"

[dependencies]
coiman-core = { path = "../coiman-core" }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "glow"] }
# Emoji fonts are their own feature since 0.37.
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
serde_json = "1"
trash = "5.2.9"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }

# On Linux the window opens through X11 or Wayland, whichever the desktop runs.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }
