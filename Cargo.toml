[package]
name = "rust-code"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
rfd = "0.17.2"
ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }
serde = { version = "1.0.229", features = ["derive"] }
