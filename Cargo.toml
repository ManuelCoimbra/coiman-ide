[package]
name = "rust-code"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["core", "tools/rcplugin"]
exclude = ["examples/plugins", "core/tests/fixtures"]

[dependencies]
rust-code-core = { path = "core" }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "glow"] }
egui = "0.37.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
serde_json = "1"
trash = "5.2.9"
ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }

# Debug builds stay small: line numbers for our code, nothing for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
