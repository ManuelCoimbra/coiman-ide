name: Release

# A tag such as v0.2.0 builds the Windows program and publishes a release with it, its notes
# taken from that version's section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (Windows, GNU)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
      # gcc builds the tree-sitter grammars; windres puts the icon in the program.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
      - name: MinGW on PATH
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build
        shell: pwsh
        run: cargo build --release --locked -p coiman-ide
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $dir = "dist/coiman-ide-$version-windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/coiman-ide.exe, README.md, LICENSE, CHANGELOG.md, PRIVACY.md $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"
          ./scripts/release-notes.ps1 $version | Out-File notes.md -Encoding utf8
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          gh release create "${{ github.ref_name }}" "dist/coiman-ide-$version-windows-x64.zip" --title "Coiman IDE $version" --notes-file notes.md
