name: Linux packages

# Builds Coiman IDE for Linux (x86_64 and ARM64) as tar.gz, deb, rpm, AppImage, Flatpak and
# Snap, plus Arch PKGBUILDs, then installs each on representative distributions and starts it
# on a virtual screen. A v* tag also attaches the packages to that release.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "packaging/**"
      - ".github/workflows/linux.yml"
      - "crates/coiman-ide/Cargo.toml"
      - "crates/coiman-ide/src/main.rs"
  workflow_dispatch:
    inputs:
      tag:
        description: "A release to attach the packages to (v0.4.0), when run by hand"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    # Ubuntu 22.04's glibc (2.35) is older than every distribution tested below, so the program
    # built here runs on all of them.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-x11-0 libxcb-xkb1 rpm desktop-file-utils appstream
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: cargo build --release --locked -p coiman-ide
      - name: Libraries it links
        run: ldd target/release/coiman-ide
      - name: Check the launcher and metadata
        run: |
          desktop-file-validate packaging/linux/io.github.manuelcoimbra.CoimanIde.desktop
          appstreamcli validate --no-net --pedantic packaging/linux/io.github.manuelcoimbra.CoimanIde.metainfo.xml || \
            appstreamcli validate --no-net packaging/linux/io.github.manuelcoimbra.CoimanIde.metainfo.xml
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool
      - name: Packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/coiman-ide/Cargo.toml | head -1)
          echo "version $version"
          APPIMAGETOOL=$PWD/appimagetool GITHUB_RELEASES=${{ github.repository }}             sh packaging/linux/build-packages.sh target/release/coiman-ide "$version" dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  deb:
    name: deb on ${{ matrix.image }} (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "ubuntu:24.04"]
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - name: Install
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ./dist/*.deb xvfb xauth libgl1-mesa-dri
          test -f /usr/share/applications/io.github.manuelcoimbra.CoimanIde.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/io.github.manuelcoimbra.CoimanIde.png
      - name: Start
        run: sh packaging/linux/smoke.sh
      - name: Remove, keeping settings
        run: |
          mkdir -p ~/.config/coiman-ide && touch ~/.config/coiman-ide/keep
          apt-get remove -y coiman-ide
          if command -v coiman-ide; then echo still installed; exit 1; fi
          test -f ~/.config/coiman-ide/keep

  rpm:
    name: rpm on ${{ matrix.image }} (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:41", "opensuse/tumbleweed"]
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    steps:
      - name: Tools the actions need
        run: |
          if command -v dnf; then dnf install -y tar gzip findutils; else zypper --non-interactive install tar gzip findutils; fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - name: Install
        run: |
          if command -v dnf; then
            dnf install -y ./dist/*.rpm xorg-x11-server-Xvfb xauth mesa-dri-drivers which
          else
            zypper --non-interactive install --allow-unsigned-rpm ./dist/*.rpm xvfb-run Mesa-dri which gawk
          fi
          test -f /usr/share/applications/io.github.manuelcoimbra.CoimanIde.desktop
      - name: Start
        run: sh packaging/linux/smoke.sh
      - name: Remove, keeping settings
        run: |
          mkdir -p ~/.config/coiman-ide && touch ~/.config/coiman-ide/keep
          if command -v dnf; then dnf remove -y coiman-ide; else zypper --non-interactive remove coiman-ide; fi
          if command -v coiman-ide; then echo still installed; exit 1; fi
          test -f ~/.config/coiman-ide/keep

  appimage-and-tar:
    name: AppImage and tar.gz (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - name: Screen and GL for the test
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri libfuse2t64
      - name: AppImage starts
        run: |
          chmod +x dist/*.AppImage
          sh packaging/linux/smoke.sh "$(ls dist/*.AppImage)"
      - name: AppImage says where its updates are, with its .zsync beside it
        run: |
          appimage=$(ls dist/*.AppImage)
          info=$("$appimage" --appimage-updateinformation)
          echo "update information: $info"
          test "$info" = "gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY#*/}|latest|Coiman_IDE-*-${{ matrix.arch }}.AppImage.zsync"
          test -s "$appimage.zsync"
          head -c 400 "$appimage.zsync" | sed -n '1,/^$/p'
          grep -aq "^URL: $(basename "$appimage")$" "$appimage.zsync"
      - name: tar.gz installs for one user, starts, and uninstalls keeping settings
        run: |
          # The archive has no package manager behind it: the library it needs, as documented.
          sudo apt-get install -y libxkbcommon-x11-0
          mkdir unpacked && tar -C unpacked -xzf dist/*.tar.gz
          sh unpacked/*/install.sh
          test -f ~/.local/share/applications/io.github.manuelcoimbra.CoimanIde.desktop
          grep -q "^Exec=$HOME/.local/bin/coiman-ide" ~/.local/share/applications/io.github.manuelcoimbra.CoimanIde.desktop
          sh packaging/linux/smoke.sh ~/.local/bin/coiman-ide
          mkdir -p ~/.config/coiman-ide && touch ~/.config/coiman-ide/keep
          sh unpacked/*/uninstall.sh
          test ! -e ~/.local/bin/coiman-ide
          test -f ~/.config/coiman-ide/keep

  arch:
    name: Arch Linux PKGBUILDs (x86_64)
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git rust xorg-server-xvfb xorg-xauth mesa sudo
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist
      - name: A builder (makepkg doesn't run as root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: coiman-ide-bin from the release archive
        run: |
          version=$(sed -n 's/^pkgver=//p' packaging/arch/coiman-ide-bin/PKGBUILD)
          work=/home/builder/bin && mkdir -p $work
          cp packaging/arch/coiman-ide-bin/PKGBUILD $work/
          cp dist/*.tar.gz $work/coiman-ide-$version-linux-x86_64.tar.gz
          chown -R builder $work
          su builder -c "cd $work && makepkg --noconfirm -s"
          pacman -U --noconfirm $work/coiman-ide-bin-*.pkg.tar.zst
          sh packaging/linux/smoke.sh
          pacman -R --noconfirm coiman-ide-bin
      - name: coiman-ide built from source
        run: |
          version=$(sed -n 's/^pkgver=//p' packaging/arch/coiman-ide/PKGBUILD)
          work=/home/builder/src && mkdir -p $work
          cp packaging/arch/coiman-ide/PKGBUILD $work/
          git archive --format=tar.gz --prefix=coiman-ide-$version/ -o $work/coiman-ide-$version.tar.gz HEAD
          chown -R builder $work
          su builder -c "cd $work && makepkg --noconfirm -s"
          pacman -U --noconfirm $work/coiman-ide-$version-*.pkg.tar.zst
          sh packaging/linux/smoke.sh
          pacman -R --noconfirm coiman-ide

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: build
    # Flathub's runtime updates fail now and then on the runners ("Invalid cross-device
    # link"): a failed Flatpak doesn't hold the other packages back from the release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      # The image's runtimes can be older than Flathub's: updated here, on their own, as
      # updating them from inside flatpak-builder fails ("Invalid cross-device link").
      - name: Runtimes up to date
        run: |
          flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak update --system -y --noninteractive
          flatpak install --system -y --noninteractive flathub org.freedesktop.Sdk//24.08 org.freedesktop.Platform//24.08
      - name: Archive beside the manifest
        run: cp dist/*.tar.gz packaging/flatpak/coiman-ide-linux.tar.gz
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: coiman-ide-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/io.github.manuelcoimbra.CoimanIde.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-${{ matrix.arch }}-${{ github.sha }}
          upload-artifact: false
      - name: Install and start
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive coiman-ide-${{ matrix.arch }}.flatpak
          flatpak run --user io.github.manuelcoimbra.CoimanIde --version
          flatpak uninstall --user -y --noninteractive io.github.manuelcoimbra.CoimanIde
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: coiman-ide-${{ matrix.arch }}.flatpak

  snap:
    name: Snap (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - name: Payload and version
        run: |
          mkdir -p unpacked packaging/snap/payload
          tar -C unpacked -xzf dist/*.tar.gz
          cp -R unpacked/*/bin unpacked/*/share packaging/snap/payload/
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/coiman-ide/Cargo.toml | head -1)
          sed -i "s/^version: .*/version: '$version'/" packaging/snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: snap
        with:
          path: packaging/snap
      - name: Install, start, remove
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          sudo snap install --dangerous --classic ${{ steps.snap.outputs.snap }}
          sh packaging/linux/smoke.sh /snap/bin/coiman-ide
          sudo snap remove coiman-ide
          cp ${{ steps.snap.outputs.snap }} coiman-ide-${{ matrix.arch }}.snap
      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.arch }}
          path: coiman-ide-${{ matrix.arch }}.snap

  # The signed APT and RPM repositories (packaging/linux/make-repo.sh). A release signs them with
  # the REPO_GPG_KEY secret and they go to GitHub Pages; otherwise a throwaway key signs them,
  # so every run checks that apt, dnf and zypper accept them.
  repository:
    name: APT and RPM repository
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    env:
      REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm gnupg
      - name: Signing key
        id: key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          if [ "$RELEASE" = true ] && [ -n "$REPO_GPG_KEY" ]; then
            printf '%s\n' "$REPO_GPG_KEY" | gpg --batch --import
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing with a throwaway key: this run publishes nothing."
            gpg --batch --passphrase '' --quick-gen-key "Coiman IDE test key" rsa3072 sign never
          fi
          echo "REPO_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')" >> "$GITHUB_ENV"
      - name: Repositories
        run: sh packaging/linux/make-repo.sh dist site "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: repository
          path: site
      - if: steps.key.outputs.signed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  repository-test:
    name: Install from the repository on ${{ matrix.image }}
    needs: repository
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04", "fedora:41", "opensuse/tumbleweed"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Tools the actions need
        run: |
          if command -v dnf; then dnf install -y tar gzip findutils
          elif command -v zypper; then zypper --non-interactive install tar gzip findutils
          fi
      - uses: actions/download-artifact@v4
        with:
          name: repository
          path: /srv/repo
      # Read from the folder instead of the web address, with every signature still checked.
      - name: Add the repository and install, as docs/INSTALL-LINUX.md says
        run: |
          chmod -R a+rX /srv/repo
          if command -v apt-get; then
            cp /srv/repo/coiman-ide.asc /usr/share/keyrings/coiman-ide.asc
            sed 's|^URIs: .*|URIs: file:/srv/repo/deb|' /srv/repo/coiman-ide.sources > /etc/apt/sources.list.d/coiman-ide.sources
            apt-get update 2>&1 | tee update.log
            if grep -q -i -E "not signed|NO_PUBKEY|BADSIG|is not valid" update.log; then exit 1; fi
            DEBIAN_FRONTEND=noninteractive apt-get install -y coiman-ide
            apt-cache policy coiman-ide | grep -q "file:/srv/repo/deb stable"
          elif command -v dnf; then
            sed -e 's|^baseurl=.*|baseurl=file:///srv/repo/rpm|' -e 's|^gpgkey=.*|gpgkey=file:///srv/repo/coiman-ide.asc|' \
              /srv/repo/coiman-ide.repo > /etc/yum.repos.d/coiman-ide.repo
            dnf install -y coiman-ide
            rpm -q --qf '%{SIGPGP:pgpsig}%{RSAHEADER:pgpsig}\n' coiman-ide | grep -q -i "key id"
          else
            sed -e 's|^baseurl=.*|baseurl=file:///srv/repo/rpm|' -e 's|^gpgkey=.*|gpgkey=file:///srv/repo/coiman-ide.asc|' \
              /srv/repo/coiman-ide.repo > /tmp/coiman-ide.repo
            zypper --non-interactive addrepo /tmp/coiman-ide.repo
            zypper --non-interactive --gpg-auto-import-keys refresh coiman-ide
            zypper --non-interactive install coiman-ide
          fi
          test -x /usr/bin/coiman-ide

  publish:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [deb, rpm, appimage-and-tar, arch, flatpak, snap, repository-test, flathub]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # The tag pushed, or the one given when run by hand.
      TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      # Only the packages: the repository's site is not a release file.
      - uses: actions/download-artifact@v4
        with:
          pattern: "{linux,flatpak,snap}-*"
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: flathub
          path: artifacts
      - name: PKGBUILDs with this version and its checksums
        run: |
          version=${TAG#v}
          mkdir -p arch
          x86=$(sha256sum artifacts/coiman-ide-$version-linux-x86_64.tar.gz | cut -d' ' -f1)
          arm=$(sha256sum artifacts/coiman-ide-$version-linux-aarch64.tar.gz | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=$version/" -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$x86')/" \
              -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$arm')/" packaging/arch/coiman-ide-bin/PKGBUILD > arch/PKGBUILD-coiman-ide-bin
          curl -fsSL -o source.tar.gz "https://github.com/${GITHUB_REPOSITORY}/archive/$TAG.tar.gz"
          src=$(sha256sum source.tar.gz | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=$version/" -e "s/^sha256sums=.*/sha256sums=('$src')/" \
              packaging/arch/coiman-ide/PKGBUILD > arch/PKGBUILD-coiman-ide
      - uses: actions/upload-artifact@v4
        with:
          name: pkgbuilds
          path: arch
      - name: Upload (once the Windows job has made the release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$TAG" artifacts/* arch/* --clobber

  # GitHub Pages serves the signed repositories. Settings > Pages > Source must be "GitHub
  # Actions" (docs/PUBLISHING.md).
  pages:
    name: Repository to GitHub Pages
    needs: [repository, publish]
    if: needs.repository.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # With the SNAPCRAFT_STORE_CREDENTIALS secret, the snaps go to the Snap Store's stable
  # channel, from which snapd updates installed copies by itself.
  snap-store:
    name: Snap Store
    needs: publish
    runs-on: ubuntu-24.04
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: snap-*
          path: snaps
          merge-multiple: true
      - name: Upload to the stable channel
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then echo "No SNAPCRAFT_STORE_CREDENTIALS secret: Snap Store not updated."; exit 0; fi
          sudo snap install snapcraft --classic
          for snap in snaps/*.snap; do snapcraft upload --release=stable "$snap"; done

  # With the AUR_SSH_KEY secret, both PKGBUILDs go to the AUR, from which AUR helpers (yay,
  # paru) update installed copies. A package that isn't on the AUR yet is made by the push.
  aur:
    name: AUR
    needs: publish
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pkgbuilds
          path: pkgbuilds
      - name: Push the PKGBUILDs
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then echo "No AUR_SSH_KEY secret: AUR not updated."; exit 0; fi
          pacman -Syu --noconfirm --needed base-devel git openssh
          sh packaging/arch/push-aur.sh pkgbuilds "${TAG#v}"

  # The Flathub manifest builds from the source, with every crate given beforehand
  # (cargo-sources.json), as Flathub builds without a network. A release attaches both, for
  # the update pull request to the Flathub repository (docs/PUBLISHING.md).
  flathub:
    name: Flathub manifest (x86_64)
    runs-on: ubuntu-24.04
    # Flathub's runtime updates fail now and then on the runners; this never holds a release.
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
      TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}
      - name: Crates for the offline build
        run: sh packaging/flathub/cargo-sources.sh packaging/flathub/cargo-sources.json
      - name: Runtimes up to date
        run: |
          flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak update --system -y --noninteractive
          flatpak install --system -y --noninteractive flathub org.freedesktop.Sdk//24.08 org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08 org.flatpak.Builder
      - name: Lint the manifest and metadata as Flathub does
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flathub/io.github.manuelcoimbra.CoimanIde.yml || true
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream packaging/linux/io.github.manuelcoimbra.CoimanIde.metainfo.xml || true
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: coiman-ide-flathub-test.flatpak
          manifest-path: packaging/flathub/io.github.manuelcoimbra.CoimanIde.yml
          arch: x86_64
          cache-key: flathub-${{ github.sha }}
          upload-artifact: false
      - name: Installs, with the program and its extensions
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive coiman-ide-flathub-test.flatpak
          flatpak run --user --command=sh io.github.manuelcoimbra.CoimanIde -c 'test -x /app/bin/coiman-ide && ls /app/share/coiman-ide/extensions'
          flatpak uninstall --user -y --noninteractive io.github.manuelcoimbra.CoimanIde
      - name: Files for the Flathub repository
        if: env.RELEASE == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh packaging/flathub/for-flathub.sh "$TAG" "$(git rev-parse HEAD)" flathub-out
          tar -C flathub-out -czf "flathub-${TAG#v}.tar.gz" .
      - if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flathub
          path: flathub-*.tar.gz
