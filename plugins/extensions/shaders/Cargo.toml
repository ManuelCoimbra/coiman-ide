[package]
name = "shaders"
version = "1.0.0"
edition = "2024"
publish = false

# A Coiman IDE extension, installed only when wanted. Build with scripts/build-plugins.ps1.

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "glsl-out"] }
regex = "1"

[profile.release]
opt-level = "s"
strip = true
lto = true

# Built on its own for wasm32, not part of the editor workspace.
[workspace]
