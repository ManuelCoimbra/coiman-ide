id = "coiman.code-health"
name = "Code Health"
version = "1.5.0"
description = "Secrets left in files, code an attacker could use (SQL and HTML put together from strings, C calls that can write past a buffer, Rust unsafe), TODO, FIXME and HACK notes by age and area, the most complex functions, code written twice, public items with no docs, the dependencies (ones the code never uses, what changed since a commit, versions pinned twice, what's out of date, a tree), their licences and known vulnerabilities; and a page about the project; with the project's own settings: paths left out, findings allowed on purpose, and quality gates."
permissions = ["workspace-read"]
programs = ["cargo", "npm", "python", "poetry", "uv", "git"]

[[commands]]
id = "check"
title = "Code Health: Check Project"

[[commands]]
id = "updates"
title = "Code Health: Check for Updates"

[[commands]]
id = "audit"
title = "Code Health: Run the Audits"

[[commands]]
id = "overview"
title = "Project: Generate Overview"

[[panels]]
id = "health"
title = "Code Health"

[[tree_views]]
id = "deps"
title = "Dependencies"
