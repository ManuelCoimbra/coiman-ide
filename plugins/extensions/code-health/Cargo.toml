[package]
name = "code-health"
version = "1.1.0"
edition = "2024"
publish = false

# A Coiman IDE extension, installed only when wanted. Build with scripts/build-plugins.ps1.

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
regex = "1"
toml = "1"
serde_json = "1.0"

[profile.release]
opt-level = "s"
strip = true
lto = true

# Built on its own for wasm32, not part of the editor workspace.
[workspace]
