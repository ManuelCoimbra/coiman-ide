[package]
name = "binary-size"
version = "1.0.0"
edition = "2024"
publish = false

# A Coiman IDE extension, installed only when wanted. Build with scripts/build-plugins.ps1.

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
object = { version = "0.40", default-features = false, features = ["read", "std"] }
rustc-demangle = "0.1.28"
cpp_demangle = "0.5.1"

[profile.release]
opt-level = "s"
strip = true
lto = true

# Built on its own for wasm32, not part of the editor workspace.
[workspace]
