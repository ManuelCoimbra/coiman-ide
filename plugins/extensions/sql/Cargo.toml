[package]
name = "sql"
version = "1.2.0"
edition = "2024"
publish = false

# A Coiman IDE extension, installed only when wanted. Build with scripts/build-plugins.ps1.

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = "0.41"


[profile.release]
opt-level = "s"
strip = true
lto = true

# Built on its own for wasm32, not part of the editor workspace.
[workspace]
